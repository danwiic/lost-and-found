# Opt-in override: publishes the embedder's Swagger UI to the host, loopback
# only. The default stack (docker-compose.yml) keeps the service internal-only.
#
#   docker compose -f docker-compose.yml -f compose.docs.yml up -d embedder
#   -> http://127.0.0.1:8000/docs
#
# Back to internal-only afterwards with a plain: docker compose up -d embedder
services:
  embedder:
    ports:
      - '127.0.0.1:8000:8000'
